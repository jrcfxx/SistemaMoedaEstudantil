services:
  postgres:
    image: postgres:16-alpine
    container_name: moeda_estudantil_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moeda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moeda_pass}
      POSTGRES_DB: ${POSTGRES_DB:-moeda_estudantil}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-moeda_user} -d ${POSTGRES_DB:-moeda_estudantil}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moeda_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: moeda_estudantil_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@moeda.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - moeda_network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  moeda_network:
    driver: bridge
